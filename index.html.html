<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1f1b16;--mu:#5c554c;--ac:#b83c0a;--on:#fff;--ln:#ddd6cc;--ok:#1b6e3a;--wa:#8a5a00;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--card:#211d17;--tx:#f3ede4;--mu:#b8aea0;--ac:#ff8a5c;--on:#1a0c04;--ln:#3b352c;--ok:#5fd18a;--wa:#f0b64a;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#15120e;--card:#211d17;--tx:#f3ede4;--mu:#b8aea0;--ac:#ff8a5c;--on:#1a0c04;--ln:#3b352c;--ok:#5fd18a;--wa:#f0b64a;--er:#ff8a80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;border-inline:1px solid var(--ln)}
header{display:flex;justify-content:space-between;align-items:center;padding:.5rem 1rem;background:var(--card);border-bottom:1px solid var(--ln)}
h1{font-size:1.15rem;margin:0}h2{font-size:1.15rem;margin:.2rem 0}
main{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
button,select,input{font:inherit;color:inherit}
button,select{min-height:44px;min-width:44px;border-radius:10px;border:1.5px solid var(--ac);background:var(--card);padding:.4rem .8rem;cursor:pointer}
input[type=search]{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--ln);background:var(--card);padding:.4rem .8rem}
input[type=text]{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--ln);background:var(--card);padding:.4rem .8rem}
input[type=radio],input[type=checkbox]{width:1.3rem;height:1.3rem;accent-color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pr,button[aria-pressed=true]{background:var(--ac);color:var(--on);font-weight:600}
.pr:disabled,button:disabled{opacity:.5;cursor:not-allowed}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:.8rem;margin:0;display:block}
fieldset.cd{min-width:0}
.r{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.cd .r+.r,.cd>.r+*{margin-top:.5rem}
.mu{color:var(--mu);font-size:.88rem}
.tg{display:inline-block;font-size:.78rem;border:1px solid var(--ln);border-radius:20px;padding:.1rem .55rem;margin:.3rem .3rem 0 0}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:.3rem 0}.bar i{display:block;height:100%;border-radius:4px;background:currentColor}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}.seg button{flex:1}
.stp{list-style:none;display:flex;justify-content:space-between;padding:0;margin:.6rem 0 0;font-size:.85rem}.stp .on{font-weight:700;color:var(--ac)}
.stepper{display:flex;align-items:center;gap:.5rem}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.sl{display:flex;flex-direction:column;align-items:center;line-height:1.25}.sl .mu{color:inherit}
.qr{width:190px;margin:.4rem auto;background:#fff;padding:8px;border-radius:8px}
.cb{margin:0 1rem .5rem;width:calc(100% - 2rem);display:flex;justify-content:space-between}
nav{display:flex;background:var(--card);border-top:1px solid var(--ln)}

nav button.on{color:var(--ac);font-weight:700;background:none}
#tt{position:fixed;top:calc(env(safe-area-inset-top,0px) + .5rem);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);background:var(--tx);color:var(--bg);padding:.7rem 1rem;border-radius:12px;z-index:9}
#tt[hidden]{display:none}
.lk{background:none;border:0;color:var(--ac);text-decoration:underline}

<div id="app"></div><div id="tt" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MENU=[
{id:1,n:"Rajma Chawal",p:"mess",pr:60,a:[],v:1,s:20,t:8},
{id:2,n:"Paneer Roll",p:"canteen",pr:50,a:["gluten","dairy"],v:1,s:8,t:6},
{id:3,n:"Veg Biryani",p:"mess",pr:70,a:[],v:1,s:0,t:10},
{id:4,n:"Chole Bhature",p:"canteen",pr:60,a:["gluten"],v:1,s:15,t:7},
{id:5,n:"Chicken Curry Rice",p:"mess",pr:80,a:[],v:0,s:12,t:9},
{id:6,n:"Peanut Chaat",p:"canteen",pr:40,a:["nuts"],v:1,s:10,t:4},
{id:7,n:"Masala Dosa",p:"canteen",pr:55,a:[],v:1,s:3,t:8},
{id:8,n:"Dal Tadka Roti",p:"mess",pr:55,a:["gluten","dairy"],v:1,s:25,t:7},
{id:9,n:"Almond Halwa",p:"mess",pr:35,a:["nuts","dairy"],v:1,s:9,t:3},
{id:10,n:"Egg Fried Rice",p:"canteen",pr:65,a:["egg"],v:0,s:11,t:8}];
const AL=["nuts","dairy","gluten","egg"],SL=[750,760,770,780,790,800],OS=["Placed","Preparing","Ready","Collected"],NOW=725;
const NV=[["home","Home","⌂"],["menu","Menu","☰"],["orders","Orders","▤"],["wallet","Wallet","₹"]];
let S={type:"hosteller",cls:"13:00",al:[],coup:3,bal:150,hist:[{t:"Mess coupon used",d:"Yesterday",v:"−1 coupon"},{t:"Money added",d:"21 Oct",v:"+Rs 200"}],cart:{},slot:null,order:null,seq:213,note:"",lm:null,fs:16};
try{Object.assign(S,JSON.parse(localStorage.getItem("iiitd-food")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("iiitd-food",JSON.stringify(S))}catch(e){}};
let scr="home",tab="all",q="",showAll=false,pm=null,err="",fail=false,listening="",tT,lastK=-1;
let C={mess:{w:12,s:12,tr:1},canteen:{w:3,s:40,tr:-1}};
const tm=m=>{const h=Math.floor(m/60);return (h>12?h-12:h)+":"+String(m%60).padStart(2,"0")};
const cm=s=>{const [h,m]=s.split(":");return +h*60+ +m};
const st=i=>i==0?"Full":i==1?"Busy":"Free";
const lv=w=>w>=10?["High","█","er"]:w>=5?["Medium","▅","wa"]:["Low","▂","ok"];
const items=()=>MENU.filter(m=>S.cart[m.id]).map(m=>({...m,q:S.cart[m.id]}));
const tot=()=>items().reduce((a,m)=>a+m.pr*m.q,0);
const cnt=()=>items().reduce((a,m)=>a+m.q,0);
const prep=()=>Math.max(0,...items().map(m=>m.t));
const ven=()=>{const v=[...new Set(items().map(m=>m.p))];return v.length>1?"Mess + Canteen counters":v[0]=="mess"?"Mess counter 2":"Canteen counter 1"};
const sug=()=>{const c=cm(S.cls)-10,p=prep()||8;let b=-1;SL.forEach((s,i)=>{if(st(i)!="Full"&&s+p<=c)b=i});return b<0?SL.findIndex((s,i)=>st(i)!="Full"):b};
const dm=()=>S.lm||(S.type=="hosteller"?"coupon":"upi");
const bad=m=>m.a.filter(a=>S.al.includes(a));
const os=()=>{const o=S.order;if(!o)return -1;if(o.done)return 3;const e=(Date.now()-o.t0)/1000;return e<5?0:e<22?1:2};
function toast(m){const t=$("#tt");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,4500)}
function qr(seed){let r=seed*9301+49297,s="",F=[[0,0],[14,0],[0,14]];
for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on,f=F.find(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7);
if(f){const a=x-f[0],b=y-f[1];on=a%6==0||b%6==0||(a>1&&a<5&&b>1&&b<5)}
else if((x<8&&y<8)||(x>13&&y<8)||(x<8&&y>13))on=false;
else{r=(r*1103515245+12345)&0x7fffffff;on=((r>>8)&1)==0}
if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg viewBox="0 0 21 21" role="img" aria-label="Order QR code" fill="#000" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/>${s}</svg>`}
/* ---------- crowd ---------- */
const crowd=()=>[["mess","Mess"],["canteen","Canteen"]].map(([k,n])=>{const c=C[k],[l,i,cl]=lv(c.w);
return `<div><div class="r"><b>${n}</b><span class="${cl}"><span aria-hidden="true">${i}</span> ${l} · ~${c.w} min wait</span></div><div class="bar ${cl}"><i style="width:${c.w*5}%"></i></div><div class="mu">${c.s} seats free · ${c.tr>0?"↑ busier in 15 min":"↓ easing in 15 min"}</div></div>`}).join("");
function drift(){for(const k in C){const c=C[k];c.w=Math.max(1,Math.min(20,c.w+Math.round(Math.random()*2-1)));c.s=Math.max(0,Math.min(k=="mess"?60:80,c.s+Math.round(Math.random()*6-3)));c.tr=Math.random()<.5?1:-1}}
/* ---------- cards ---------- */
const card=m=>{const b=bad(m),n=S.cart[m.id]||0,out=m.s<=0,low=m.s<=8&&!out;
return `<div class="cd"><div class="r"><div><b>${m.n}</b><div class="mu">${m.p=="mess"?"Mess":"Canteen"} · ${m.v?"Veg":"Non-veg"} · Rs ${m.pr}</div><div>`+
(S.al.length?(b.length?`<span class="tg er">⚠ Contains ${b.join(", ")}</span>`:`<span class="tg ok">✓ Safe for you</span>`):(m.a.length?`<span class="tg">Contains ${m.a.join(", ")}</span>`:`<span class="tg">No listed allergens</span>`))+
`<span class="tg ${out?"er":low?"wa":"ok"}">${out?"Sold out":low?m.s+" left":"Available"}</span></div></div>`+
(out?"":n?`<div class="stepper"><button aria-label="Remove one ${m.n}" onclick="add(${m.id},-1)">−</button><b>${n}</b><button aria-label="Add one ${m.n}" onclick="add(${m.id},1)">+</button></div>`:`<button class="pr" aria-label="Add ${m.n}" onclick="add(${m.id},1)">+ Add</button>`)+`</div></div>`};
const res=()=>MENU.filter(m=>(tab=="all"||m.p==tab)&&m.n.toLowerCase().includes(q.toLowerCase()));
const ml=()=>{const all=res(),h=all.filter(m=>bad(m).length).length,sh=showAll?all:all.filter(m=>!bad(m).length);
return (sh.length?sh.map(card).join(""):`<div class="cd mu">No dishes found.</div>`)+(h?`<button class="lk" onclick="showAll=!showAll;render()">${showAll?"Hide":"Show"} ${h} dish${h>1?"es":""} with your allergens</button>`:"")};
/* ---------- screens ---------- */
const home=()=>{const o=S.order&&!S.order.done,k=os();return `
<div class="cd"><div class="r"><div><b>Next class</b><div class="mu">Suggested pick-up: <b>${tm(SL[sug()])} PM</b><br>Demo clock: ${tm(NOW)} PM</div></div>
<select aria-label="Next class time" onchange="S.cls=this.value;sv();render()">${["12:45","13:00","13:30","14:00"].map(x=>`<option value="${x}" ${x==S.cls?"selected":""}>${tm(cm(x))} PM</option>`).join("")}</select></div>
<div class="seg" role="group" aria-label="I am a" style="margin:.6rem 0">${[["hosteller","Hosteller"],["day","Day scholar"]].map(([k,l])=>`<button aria-pressed="${S.type==k}" onclick="setT('${k}')">${l}</button>`).join("")}</div>
<button class="pr" style="width:100%" onclick="go('menu')">Pre-order lunch</button></div>
${S.type=="hosteller"&&S.coup<=3?`<div class="cd r" style="border-color:var(--wa)"><span class="wa">⚠ Running low: <b>${S.coup} coupon${S.coup==1?"":"s"}</b> left</span><button onclick="go('wallet')">Buy</button></div>`:""}
${o?`<button class="cd r" style="text-align:left;width:100%" onclick="go('track')"><span><b>Order #${S.order.id} · ${OS[k]}</b><br><span class="mu">Ready ~${tm(S.order.ready)} PM</span></span><span>Show QR ›</span></button>`:""}
<div class="cd"><div class="r"><b>Crowd right now</b><span class="tg ok" style="margin:0">● LIVE</span></div><div id="cr" style="display:grid;gap:.7rem;margin-top:.5rem">${crowd()}</div></div>
<div class="r"><b>Today’s menu</b><button class="lk" onclick="go('menu')">See all</button></div>
${MENU.filter(m=>m.s>0&&!bad(m).length).slice(0,2).map(card).join("")}
<p class="mu">Demo: crowd levels and clock are simulated.</p>`};
const menu=()=>`<div class="seg">${[["all","All"],["mess","Mess"],["canteen","Canteen"]].map(([k,l])=>`<button aria-pressed="${tab==k}" onclick="tab='${k}';render()">${l}</button>`).join("")}</div>
<div class="r"><input id="sq" type="search" placeholder="Search dishes" aria-label="Search dishes" value="${E(q)}" oninput="q=this.value;$('#ml').innerHTML=ml()"><button class="${listening?"pr":""}" aria-label="Voice search" onclick="voice()">🎤</button></div>
<div id="vs" class="mu" aria-live="polite">${E(listening)}</div>
<div><div class="mu">Allergens to avoid (saved to your profile)</div><div class="seg" role="group" aria-label="Allergens">${AL.map(a=>`<button aria-pressed="${S.al.includes(a)}" onclick="togA('${a}')">${a[0].toUpperCase()+a.slice(1)}</button>`).join("")}</div></div>
<div id="ml" style="display:grid;gap:.6rem">${ml()}</div>
<p class="mu">Allergen tags come from the mess kitchen. Please confirm with staff before eating.</p>`;
const cart=()=>{if(!cnt())return `<div class="cd" style="text-align:center"><b>Your cart is empty</b><p class="mu">Add dishes from the menu to see pick-up slots.</p><button class="pr" onclick="go('menu')">Browse menu</button></div>`;
if(S.slot==null||st(S.slot)=="Full")S.slot=sug();const p=prep();return `
<div class="cd"><b>Order summary</b>${items().map(m=>`<div class="r"><span>${m.n}<br><span class="mu">Rs ${m.pr} each</span></span><div class="stepper"><button aria-label="Remove one ${m.n}" onclick="add(${m.id},-1)">−</button><b>${m.q}</b><button aria-label="Add one ${m.n}" onclick="add(${m.id},1)">+</button></div></div>`).join("")}
<div class="r"><b>Total</b><b>Rs ${tot()}</b></div></div>
<input type="text" aria-label="Add a note" placeholder="Add a note (e.g., no nuts)" value="${E(S.note)}" oninput="S.note=this.value;sv()">
<div class="cd"><div class="r"><b>Pick-up slot</b><span class="mu">Class at ${tm(cm(S.cls))} PM</span></div><div class="sg" style="margin-top:.5rem">${SL.map((s,i)=>`<button class="sl" aria-pressed="${S.slot==i}" ${st(i)=="Full"?"disabled":""} onclick="S.slot=${i};render()"><b>${tm(s)}</b><span>${st(i)}</span><span class="mu">ready ~${tm(s+p)}</span></button>`).join("")}</div>
<p class="mu">Suggested: ${tm(SL[sug()])} PM, so you collect with time to spare before class.</p></div>
<button class="pr" onclick="go('pay')">Continue to payment</button>`};
const pay=()=>{const m=pm||dm(),t=tot(),MT=[["coupon","Mess coupons",S.coup+" left · uses 1 coupon · mess dishes only"],["upi","UPI","Pay Rs "+t+" in any UPI app"],["wallet","Wallet","Balance Rs "+S.bal]];return `
<div class="cd"><b>${cnt()} items · Rs ${t}</b><div class="mu">Pick-up ${tm(SL[S.slot])} PM · ${ven()}</div><button style="margin-top:.5rem" onclick="go('cart')">‹ Back to cart (edits kept)</button></div>
<fieldset class="cd"><legend>Pay with</legend>${MT.map(([k,l,d])=>`<label class="r" style="min-height:44px"><span><b>${l}</b><br><span class="mu">${d}</span></span><input type="radio" name="pm" ${m==k?"checked":""} onchange="pm='${k}';err='';render()"></label>`).join("")}</fieldset>
<label class="mu"><input type="checkbox" ${fail?"checked":""} onchange="fail=this.checked"> Demo: simulate a failed UPI payment</label>
${err?`<div class="cd er" role="alert" style="border-color:var(--er)">⚠ ${err}</div>`:""}
<button class="pr" onclick="place()">${err?"Retry":"Place order"} · ${tm(SL[S.slot])} PM · ${m.toUpperCase()} · Rs ${t}</button>
<p class="mu">We will notify you when your food is ready.</p>`};
const track=()=>{const o=S.order;if(!o)return `<div class="cd" style="text-align:center"><b>No active order</b><p class="mu">Pre-order to skip the queue.</p><button class="pr" onclick="go('menu')">Order food</button></div>`;
const k=os();return `<div class="cd"><div class="mu">Order #${o.id} · ${o.where}</div><h2>${k==3?"Collected. Enjoy your meal!":"Ready by "+tm(o.ready)+" PM"}</h2>
<ol class="stp">${OS.map((s,i)=>`<li class="${i<=k?"on":""}">${i<k?"✓":i==k?"●":"○"} ${s}</li>`).join("")}</ol></div>
${k<3?`<div class="cd" style="text-align:center"><div class="qr">${qr(o.id)}</div><b>Show this QR at the counter</b><div class="mu">White background keeps it scannable at any screen brightness.</div></div>`:""}
<div class="cd">${o.items.map(E).join("<br>")}<div class="mu">Paid: ${o.m.toUpperCase()} · Rs ${o.total}${o.note?" · Note: "+E(o.note):""}</div></div>
${k<2?`<button ${o.moved?"disabled":""} onclick="mv()">Running late? Move my slot (once)</button>`:""}
${k==2?`<button class="pr" onclick="S.order.done=true;sv();render()">I have collected my food</button>`:""}
${k==3?`<button class="pr" onclick="go('menu')">Order again</button>`:""}
<p class="mu">Demo speed: status updates every few seconds and a banner appears when food is ready.</p>`};
const wallet=()=>`<div class="cd"><div class="mu">Wallet balance</div><h2 style="font-size:1.8rem">Rs ${S.bal}</h2><div class="seg">${[50,100,200].map(n=>`<button onclick="topup(${n})">+ Rs ${n}</button>`).join("")}</div></div>
<div class="cd"><div class="mu">Mess coupons this month</div><h2>${S.coup} left</h2>${S.coup<=3?`<div class="wa">⚠ Running low</div>`:""}<div class="seg" style="margin-top:.5rem"><button onclick="buyC(1,60)">Buy 1 · Rs 60</button><button onclick="buyC(5,280)">Buy 5 · Rs 280</button></div></div>
<div class="cd"><b>Recent activity</b>${S.hist.slice(0,6).map(h=>`<div class="r"><span>${E(h.t)}<br><span class="mu">${E(h.d)}</span></span><b>${E(h.v)}</b></div>`).join("")}</div>`;
/* ---------- actions ---------- */
function add(id,d){const m=MENU.find(x=>x.id==id),n=(S.cart[id]||0)+d;if(n>m.s)return toast("Only "+m.s+" left");
if(d>0&&bad(m).length)toast("Contains "+bad(m).join(", ")+". Please confirm with staff.");
if(n<=0)delete S.cart[id];else S.cart[id]=n;sv();render()}
function togA(a){S.al=S.al.includes(a)?S.al.filter(x=>x!=a):[...S.al,a];sv();render()}
function setT(t){S.type=t;S.lm=null;sv();render()}
function fsz(){S.fs=S.fs==16?19:S.fs==19?22:16;document.documentElement.style.fontSize=S.fs+"px";sv()}
function topup(n){S.bal+=n;S.hist.unshift({t:"Money added",d:"Today "+tm(NOW),v:"+Rs "+n});sv();render();toast("Added Rs "+n+" to wallet")}
function buyC(n,p){if(S.bal<p)return toast("Not enough balance. Add money first.");S.bal-=p;S.coup+=n;S.hist.unshift({t:"Bought "+n+" coupon"+(n>1?"s":""),d:"Today "+tm(NOW),v:"−Rs "+p});sv();render()}
function mv(){const o=S.order;let i=o.slot+1;while(i<SL.length&&st(i)=="Full")i++;if(i>=SL.length)return toast("No later slot available.");
o.slot=i;o.ready=SL[i]+o.prep;o.moved=true;sv();render();toast("Slot moved to "+tm(SL[i])+" PM")}
function place(){const t=tot(),m=pm||dm();err="";
if(m=="coupon"){if(items().some(i=>i.p!="mess"))err="Coupons work for mess dishes only. Choose UPI or Wallet.";else if(S.coup<1)err="No coupons left. Buy coupons in Wallet or pay another way."}
if(m=="wallet"&&S.bal<t)err="Wallet balance is Rs "+S.bal+" but you need Rs "+t+". Add money or pick another method.";
if(m=="upi"&&fail)err="UPI payment failed (demo). Nothing was charged. Tap Retry.";
if(err)return render();
if(m=="coupon")S.coup--;if(m=="wallet")S.bal-=t;
const n=++S.seq;S.order={id:n,items:items().map(i=>i.n+" × "+i.q),total:t,slot:S.slot,prep:prep(),ready:SL[S.slot]+prep(),m,t0:Date.now(),done:false,moved:false,where:ven(),note:S.note};
S.hist.unshift({t:"Lunch order #"+n,d:"Today "+tm(NOW),v:m=="coupon"?"−1 coupon":"−Rs "+t});S.lm=m;S.cart={};S.slot=null;S.note="";sv();go("track")}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("Voice search is not supported in this browser. Please type instead.");
try{const r=new R();r.lang="en-IN";r.interimResults=true;listening="Listening…";render();
r.onresult=e=>{q=[...e.results].map(x=>x[0].transcript).join(" ");listening="Heard: "+q;$("#sq").value=q;$("#ml").innerHTML=ml();$("#vs").textContent=listening};
r.onend=()=>{listening="";render();try{speechSynthesis.speak(new SpeechSynthesisUtterance(res().length+" dishes found"))}catch(e){}};
r.onerror=()=>{listening="";render();toast("Could not hear you. Check microphone permission or type instead.")};r.start()}catch(e){listening="";toast("Voice search unavailable.")}}
function go(s){if(s=="orders")s=S.order&&!S.order.done?"track":"cart";if(s=="pay"&&(!cnt()||S.slot==null))s="cart";scr=s;err="";pm=null;render();$("#main").scrollTop=0}
function render(){const y=$("#main")?scr_y():0,T={home:"IIITD Food",menu:"Menu",cart:"Your order",pay:"Payment",track:"Order tracking",wallet:"Wallet"},
on=["home","menu","wallet"].includes(scr)?scr:"orders",cb=cnt()&&["home","menu","wallet"].includes(scr);
$("#app").innerHTML=`<header><h1>${T[scr]}</h1><button aria-label="Change text size" onclick="fsz()">Aa</button></header><main id="main">${({home,menu,cart,pay,track,wallet})[scr]()}</main>`+
(cb?`<button class="cb pr" onclick="go('cart')"><span>${cnt()} item${cnt()>1?"s":""} · Rs ${tot()}</span><span>View order ›</span></button>`:"")+
`<nav aria-label="Main">${NV.map(([k,l,i])=>`<button class="${on==k?"on":""}" ${on==k?'aria-current="page"':""} onclick="go('${k}')"><span aria-hidden="true">${i}</span>${l}</button>`).join("")}</nav>`;
$("#main").scrollTop=y}
const scr_y=()=>$("#main").scrollTop;
setInterval(()=>{const k=os();if(k!=lastK){if(k==2&&S.order)toast("Order #"+S.order.id+" is ready. Collect at "+S.order.where+".");lastK=k;if(scr=="track"||scr=="home")render()}},1000);
setInterval(()=>{drift();const c=$("#cr");if(c)c.innerHTML=crowd()},5000);
document.documentElement.style.fontSize=(S.fs||16)+"px";
render();
</script></body></html>
